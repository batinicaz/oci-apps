version: 2

backends:
  oci:
    type: rclone
    path: oci-backup:${BUCKET_NAME}/backups/restic-repo

global:
  forget:
    keep-daily: 7
    keep-weekly: 4
    keep-monthly: 3

locations:
  freshrss:
    from: /opt/data/freshrss
    to:
      - oci
    options:
      backup:
        exclude:
          - "*.log"
          - "*.tmp"

  vikunja:
    from: /opt/data/vikunja
    to:
      - oci

  trek:
    from: /opt/data/trek
    to:
      - oci

  podly:
    from: /opt/data/podly/instance
    to:
      - oci
    options:
      backup:
        exclude:
          - "logs/"
          - "data/in/"
          - "*.db-shm"
          - "*.db-wal"
      forget:
        keep-daily: 7
        keep-weekly: 2

  audiobookshelf:
    from: /opt/data/audiobookshelf
    to:
      - oci
    options:
      forget:
        keep-daily: 7
        keep-weekly: 2
