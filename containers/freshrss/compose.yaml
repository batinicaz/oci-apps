networks:
  traefik:
    external: true
  freshrss-feeds:
    external: true
  internal:
    name: freshrss_default

services:
  freshrss:
    container_name: freshrss
    image: docker.io/freshrss/freshrss:1.30.0@sha256:258b8edfc8a76a61f60d2d6a14d8f8d12495d78abf38646a2137612dfa264a21
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    group_add:
      - "33"
    tmpfs:
      - /tmp
      - /var/log
      - /run
      - /etc
      - /var/lib/php/sessions
      - /var/spool/cron
      - /var/www/FreshRSS/Docker
      - /var/www/FreshRSS/extensions
    volumes:
      - /opt/data/freshrss/config:/var/www/FreshRSS/data:z
    env_file:
      - /opt/secrets/freshrss.env
    environment:
      TZ: Europe/London
      CRON_MIN: 01,21,41
      INTERNAL_HOST_ALLOWLIST: nitter:8080 fulltextrss:80 redlib:8080
      OIDC_ENABLED: 1
      OIDC_X_FORWARDED_HEADERS: X-Forwarded-Host X-Forwarded-Port X-Forwarded-Proto
      OIDC_REMOTE_USER_CLAIM: preferred_username
      OIDC_SCOPES: openid email profile
      FRESHRSS_INSTALL: |-
        --api-enabled
        --auth-type http_auth
        --default-user ${USER}
        --disable-update
        --language en
        --title FreshRSS
    networks:
      - traefik
      - freshrss-feeds
      - internal

  fulltextrss:
    container_name: fulltextrss
    image: ghcr.io/batinicaz/fulltextrss:latest@sha256:9fe1a0aa1e2739b657df8d75d551c8322dcb33b64a45e21c6252ffbaf1f83fc4
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 80
    tmpfs:
      - /tmp:mode=1777
    volumes:
      - /opt/data/freshrss/fulltextrss-cache:/var/www/html/cache/rss-with-key:z,U
      - /opt/secrets/fulltextrss-config.php:/var/www/html/custom_config.php:ro,z
      - ./fulltextrss-nytimes.com.txt:/var/www/html/site_config/custom/nytimes.com.txt:ro,z
      - ./fulltextrss-theregister.com.txt:/var/www/html/site_config/custom/theregister.com.txt:ro,z
      - ./fulltextrss-theregister.com.txt:/var/www/html/site_config/custom/api.theregister.com.txt:ro,z
    networks:
      - traefik
      - internal
