networks:
  traefik:
    external: true
  freshrss-feeds:
    external: true
  internal:
    name: freshrss_default

services:
  freshrss:
    container_name: freshrss
    image: docker.io/freshrss/freshrss:1.30.0@sha256:258b8edfc8a76a61f60d2d6a14d8f8d12495d78abf38646a2137612dfa264a21
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/log
      - /run
      - /etc
      - /var/lib/php/sessions
      - /var/spool/cron
      - /var/www/FreshRSS/Docker
      - /var/www/FreshRSS/extensions
    volumes:
      - /opt/data/freshrss/config:/var/www/FreshRSS/data:z
    env_file:
      - /opt/secrets/freshrss.env
    environment:
      TZ: Europe/London
      CRON_MIN: 01,21,41
      INTERNAL_HOST_ALLOWLIST: nitter:8080 fulltextrss:80
      OIDC_ENABLED: 1
      OIDC_X_FORWARDED_HEADERS: X-Forwarded-Host X-Forwarded-Port X-Forwarded-Proto
      OIDC_REMOTE_USER_CLAIM: preferred_username
      OIDC_SCOPES: openid email profile
      FRESHRSS_INSTALL: |-
        --api-enabled
        --auth-type http_auth
        --default-user ${USER}
        --disable-update
        --language en
        --title FreshRSS
    networks:
      - traefik
      - freshrss-feeds
      - internal

  fulltextrss:
    container_name: fulltextrss
    image: ghcr.io/batinicaz/fulltextrss:3.9.13@sha256:2c51e2f26202fae080e979b1e15d214f950c109bf2f5ccb8da0b3cf3828f6c84
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/log
      - /run
    volumes:
      - /opt/data/freshrss/fulltextrss-cache:/var/www/html/cache/rss:z
      - /opt/secrets/fulltextrss-config.php:/var/www/html/custom_config.php:ro,z
    networks:
      - traefik
      - internal
