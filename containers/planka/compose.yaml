networks:
  traefik:
    external: true
  default:

services:
  planka:
    container_name: planka
    image: ghcr.io/plankanban/planka:2.2.1@sha256:125f45330853210c678fed1132bedc0912b4a11a27779b79802fbca108e069e2
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run
      - /app/logs
      - /app/.tmp
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /opt/data/planka/data:/app/data:z
    env_file:
      - /opt/secrets/planka.env
    environment:
      - DEFAULT_LANGUAGE=en-GB
      - TRUST_PROXY=true
      - OIDC_NAME_ATTRIBUTE=given_name
      - OIDC_ENFORCED=true
      - OIDC_CLAIMS_SOURCE=id_token
      - OIDC_IGNORE_USERNAME=true
    networks:
      - traefik
      - default

  postgres:
    container_name: planka-postgres
    image: public.ecr.aws/docker/library/postgres:18-alpine@sha256:122c9942437efcbbb8d595fc578dee7d26ee1543c2a8634d183adfa4a1e55b4d
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run/postgresql
    volumes:
      - /opt/data/planka/postgres:/var/lib/postgresql:z
    env_file:
      - /opt/secrets/planka-postgres.env
    environment:
      - POSTGRES_DB=planka
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d planka"]
      interval: 10s
      timeout: 5s
      retries: 5
