networks:
  traefik:
    external: true
  default:

services:
  planka:
    container_name: planka
    image: ghcr.io/plankanban/planka:2.1.1@sha256:19b507ae3ab5cb1855c3f6984249e4a4881ed0b912febdfd492139c29bf10f39
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run
      - /app/logs
      - /app/.tmp
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /opt/data/planka/data:/app/data:z
    env_file:
      - /opt/secrets/planka.env
    environment:
      - DEFAULT_LANGUAGE=en-GB
      - TRUST_PROXY=true
      - OIDC_NAME_ATTRIBUTE=given_name
      - OIDC_ENFORCED=true
      - OIDC_CLAIMS_SOURCE=id_token
      - OIDC_IGNORE_USERNAME=true
    networks:
      - traefik
      - default

  postgres:
    container_name: planka-postgres
    image: public.ecr.aws/docker/library/postgres:18-alpine@sha256:563d9a314daa3a9f8e3249e217514210a747970c36d50d83ae5e9dc6749fe354
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run/postgresql
    volumes:
      - /opt/data/planka/postgres:/var/lib/postgresql:z
    env_file:
      - /opt/secrets/planka-postgres.env
    environment:
      - POSTGRES_DB=planka
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d planka"]
      interval: 10s
      timeout: 5s
      retries: 5
