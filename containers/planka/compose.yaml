networks:
  traefik:
    external: true
  default:

services:
  planka:
    container_name: planka
    image: ghcr.io/plankanban/planka:2.1.0@sha256:32c919d9e65b0479d1bbf0e4fb8e00fb11403a5234242b9f5fc900e595c2e2ce
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run
      - /app/logs
      - /app/.tmp
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /opt/data/planka/data:/app/data:z
    env_file:
      - /opt/secrets/planka.env
    environment:
      - DEFAULT_LANGUAGE=en-GB
      - TRUST_PROXY=true
      - OIDC_NAME_ATTRIBUTE=given_name
      - OIDC_ENFORCED=true
      - OIDC_CLAIMS_SOURCE=id_token
      - OIDC_IGNORE_USERNAME=true
    networks:
      - traefik
      - default

  postgres:
    container_name: planka-postgres
    image: public.ecr.aws/docker/library/postgres:18-alpine@sha256:3f5573ba147ec72498525b8e844a9f7539a1f8da6b409640b5cde885b9926d1d
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run/postgresql
    volumes:
      - /opt/data/planka/postgres:/var/lib/postgresql:z
    env_file:
      - /opt/secrets/planka-postgres.env
    environment:
      - POSTGRES_DB=planka
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d planka"]
      interval: 10s
      timeout: 5s
      retries: 5
