networks:
  traefik:
    external: true
  podcasts:
    external: true

services:
  podly:
    container_name: podly
    image: ghcr.io/podly-pure-podcasts/podly-pure-podcasts:2.8.0-lite-arm64@sha256:b72d55f3c47a9f5ffddea26b1fea3c654f3828b49ad97ff716753ce0eb4b8860
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - /opt/data/podly/instance:/app/src/instance:z
    env_file:
      - /opt/secrets/podly.env
    environment:
      TZ: Europe/London
      REQUIRE_AUTH: "true"
    networks:
      - traefik
      - podcasts

  audiobookshelf:
    container_name: audiobookshelf
    image: ghcr.io/advplyr/audiobookshelf:2.37.2@sha256:b897c33f05972fb1bf484f7487bc878fa91ec8691335c1db6e2929c3a7658efa
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - /opt/data/podcasts:/podly-source:ro,z
      - /opt/data/audiobookshelf/podly-destination:/podly-destination:z
      - /opt/data/audiobookshelf/config:/config:z
      - /opt/data/audiobookshelf/metadata:/metadata:z
    environment:
      TZ: Europe/London
      PORT: "8000"
      METADATA_PATH: /metadata
    networks:
      - traefik
      - podcasts

  get_iplayer:
    container_name: get_iplayer
    image: ghcr.io/thespad/get_iplayer:3.24@sha256:6a75466c3aaf4ccf68dbbd198b3656d3c5dd132c1981280e77dfcfdc79cf1226
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    ports:
      - 1935:1935
    tmpfs:
      - /tmp
      - /run
    volumes:
      - /opt/data/get_iplayer/config:/config:z
      - /opt/data/podcasts:/podcasts:z
      - ./get_iplayer-init:/custom-cont-init.d:ro,z
    environment:
      TZ: Europe/London
      PUID: 1000
      PGID: 1000
      INCLUDERADIO: "true"
    networks:
      - podcasts
