name: Update Terraform Docs
on:
  push:
    branches:
      - "renovate/**"
permissions:
  contents: write
jobs:
  terraform-docs:
    uses: batinicaz/gha/.github/workflows/terraform-docs.yml@836e78da181c617999d83875e58f6fe7ca008f53 # v1
    with:
      working_directory: terraform
      output_file: ../README.md
      update_lock_file: true
      git_commit_message: "chore: update terraform docs and lock file"
    secrets:
      DOCUMENTATION_APP_ID: ${{ secrets.DOCUMENTATION_APP_ID }}
      DOCUMENTATION_PRIVATE_KEY: ${{ secrets.DOCUMENTATION_PRIVATE_KEY }}
