name: FCOS Image
# https://docs.fedoraproject.org/en-US/fedora-coreos/provisioning-oraclecloud/
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['fcos-version.json']
  push:
    branches: [main]
    paths: ['fcos-version.json']
concurrency:
  group: fcos-import
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  automerge:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.id == 29139614
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Approve PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr review --approve "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}"

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr merge --auto --squash "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}"

  import:
    if: github.event_name == 'push'
    uses: batinicaz/gha/.github/workflows/terraform-apply.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      working_directory: terraform
    secrets:
      INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}

  cleanup:
    if: github.event_name == 'push'
    needs: import
    uses: batinicaz/gha/.github/workflows/terraform-apply.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      working_directory: terraform
    secrets:
      INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}
